tools_note: >-
  Auth-gated. tools/list returned 401 without a bearer token. Brand.ai publishes no
  llms.txt, no OpenAPI, and no public developer documentation, so there is no
  second source from which the tool names could be honestly read. The scope list is
  the best available proxy for the server's capability shape: brands, brand_rules,
  brand_checks, artifacts, projects and help.
gaps:
- id: no-oauth-protected-resource-metadata
  detail: >-
    RFC 9728 /.well-known/oauth-protected-resource returns 404 at both the host root
    and the resource-specific /api/mcp path, and the 401 WWW-Authenticate header
    carries no resource_metadata parameter. A spec-compliant MCP client cannot
    discover the authorization server from the challenge; it must be told the issuer
    out of band.
- id: no-public-mcp-documentation
  detail: >-
    No docs.brand.ai, developers.brand.ai or brand.ai/mcp page exists (all NXDOMAIN
    or 404), and the marketing sitemap lists no developer page. The MCP server is
    discoverable only by probing the application host.
