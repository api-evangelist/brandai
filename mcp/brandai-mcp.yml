source: https://app.brand.ai/api/mcp
note: >-
  Brand.ai operates a REAL, hosted, remote MCP server at https://app.brand.ai/api/mcp.
  An unauthenticated JSON-RPC tools/list POST returns HTTP 401 with
  {"error":"McpSessionTokenMissingException","message":"MCP session token is required"}
  and WWW-Authenticate: Bearer realm="brand-ai-mcp" — so the endpoint exists and is
  OAuth-gated rather than absent. The authorization server at
  https://app.brand.ai/api/auth publishes RFC 8414 metadata advertising an
  `mcp:identify` scope alongside the Brand OS resource scopes, which is what
  establishes that this MCP server is a first-class product surface and not an
  internal route. The live tool set (names + inputSchema) requires an authenticated
  tools/list call, so NO tool list is recorded here — Brand.ai publishes no llms.txt
  and no developer documentation from which one could be read, and inventing tool
  names would fabricate the provider's agent surface.
