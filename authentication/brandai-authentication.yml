posture:
  strengths:
  - Open Dynamic Client Registration (RFC 7591) — an MCP client can self-register
    with no human onboarding step, which is what makes the server agent-reachable.
  - PKCE S256 is the only code challenge method offered.
  - EdDSA (Ed25519) ID token signing, ahead of the RS256 default.
  - Token introspection (RFC 7662) and revocation (RFC 7009) both published.
  - authorization_response_iss_parameter_supported (RFC 9207) — mix-up defence.
  weaknesses:
  - No RFC 9728 protected-resource metadata, and the 401 challenge omits the
    resource_metadata parameter, so the AS is not discoverable from the resource.
  - token_endpoint_auth_methods_supported includes "none" (public clients).
  - No documentation of any of this on a developer-facing page.
