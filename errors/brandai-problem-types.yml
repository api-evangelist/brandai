format_note: >-
  NOT RFC 9457. Brand.ai returns a bare JSON envelope with content-type
  application/json (never application/problem+json), and there is no `type` URI,
  no `title`, no `status` member and no error reference page to link to. Two
  distinct envelope shapes were observed on the same host, which is itself a
  finding: the generic app routes return {"error": "<string>"} while the MCP route
  returns {"error": "<ExceptionClassName>", "message": "<human string>"} — the
  `error` member carries a server-side exception class name, not a stable machine
  code.
envelope:
  content_type: application/json
  members:
  - name: error
    type: string
    note: Either a short human phrase ("Unauthorized") or a server exception class
      name ("McpSessionTokenMissingException") depending on the route.
  - name: message
    type: string
    required: false
    note: Present on the MCP route only.
  problem_json: false
  status_member: false
  type_uri: false
