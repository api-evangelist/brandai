  www_authenticate: Bearer realm="brand-ai-mcp"
  remediation: >-
    Obtain an access token from https://app.brand.ai/api/auth via authorization_code
    + PKCE (S256), registering the client at the open DCR endpoint, and present it
    as a Bearer token.
gaps:
- No public error reference page exists — Brand.ai publishes no developer docs.
- No stable machine-readable error code vocabulary; `error` leaks an implementation
  exception class name on the MCP route, which is not a contract a client can rely on.
- No RFC 9457 problem+json, so agents get no `type` URI to branch on.
