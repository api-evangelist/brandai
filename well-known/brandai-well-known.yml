source: live GET of /.well-known/* on brand.ai and app.brand.ai
note: >-
  The marketing host brand.ai serves nothing at /.well-known/ — every path returns
  the Nuxt 404 page. The APPLICATION host app.brand.ai is where Brand.ai's machine
  surface lives: it serves a real RFC 8414 OAuth 2.0 Authorization Server Metadata
  document and an identical OpenID Connect Discovery document, both advertising
  MCP-specific scopes (mcp:identify, brands:read, brand_rules:read, brand_checks:*,
  artifacts:*, projects:write, help:read). This is the discovery surface for the
  OAuth-gated remote MCP server at https://app.brand.ai/api/mcp. RFC 9728 OAuth
  Protected Resource Metadata is NOT served (404 at both the root and the
  resource-specific /.well-known/oauth-protected-resource/api/mcp path), so an MCP
  client cannot discover the authorization server from the 401 challenge alone —
  the WWW-Authenticate header is a bare `Bearer realm="brand-ai-mcp"` with no
  resource_metadata parameter.
