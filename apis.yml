aid: brandai
name: Brand.ai
description: >-
  Brand.ai (Access to Tools Inc.) is a San Francisco-based AI platform that turns a
  company's brand into machine-readable infrastructure — "your brand, as source code"
  — so that every team, tool and AI agent works from one enforced brand context. The
  product has two halves: Brand OS, which structures brand data through Brand
  Foundation (guidelines compiled into machine-readable rules), Brand Ontology (150+
  perception dimensions), Daily Signals and OAuth-connected applications (Figma,
  Notion, Google Drive, Slack, Shopify); and Brand Studio, which executes on it
  through Assistant (built on Claude), the Canvas visual strategy sandbox, Projects
  and Brand Check pre-launch risk validation. Founded in 2024 and backed by Uncork
  Capital, it targets brand leaders, agencies and enterprise teams. Brand.ai
  publishes no developer portal, no OpenAPI and no SDKs, and the product itself is
  demo-gated with no self-serve sign-up or published pricing — but it does operate a
  real hosted remote MCP server at https://app.brand.ai/api/mcp, gated by a full
  OAuth 2.0 / OpenID Connect authorization server with open Dynamic Client
  Registration and nine Brand OS resource scopes. Security posture is published:
  SOC 2 Type II, GDPR, CCPA, a Vanta trust center and a public status page.
