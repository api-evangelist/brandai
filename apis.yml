apis:
- name: Brand.ai MCP Server
  description: >-
    A hosted, remote Model Context Protocol server that lets an AI agent read a
    company's Brand OS — brands, machine-readable brand rules and artifacts — and
    write back Brand Check validations, artifacts and projects. Reachable over
    Streamable HTTP at https://app.brand.ai/api/mcp and gated by Brand.ai's own
    OAuth 2.0 authorization server, which advertises an mcp:identify scope alongside
    the Brand OS resource scopes. Discovered by probe on 2026-08-13; Brand.ai
    publishes no documentation for it, and the live tools/list is auth-gated, so no
    tool inventory is recorded.
  humanURL: https://app.brand.ai
  baseURL: https://app.brand.ai/api/mcp
